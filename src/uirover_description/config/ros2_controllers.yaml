controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_drive_controller:
  ros__parameters:
    # Drubotara has 4 wheels (2 per side)
    left_wheel_names: ["fl_wheel_joint", "bl_wheel_joint"]
    right_wheel_names: ["fr_wheel_joint", "br_wheel_joint"]

    # Wheel parameters - measured from URDF
    wheel_separation: 0.808  # Distance between left and right wheels
    wheel_radius: 0.152      # Approximate wheel radius from mesh
    wheels_per_side: 2       # 2 wheels per side (front, back)

    # Multipliers for fine-tuning
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame: odom1
    robot_base_frame: base_link
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: true
    enable_odom_tf: true

    command_topic: cmd_vel

    publish_odom: false
    publish_odom_tf: true


    cmd_vel_timeout: 0.5
    use_stamped_vel: false
