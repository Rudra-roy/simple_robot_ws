### ekf config file ###
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    
    # The filter accepts an arbitrary number of inputs from each input message type
    # (nav_msgs/Odometry, geometry_msgs/PoseWithCovarianceStamped,
    # geometry_msgs/TwistWithCovarianceStamped, sensor_msgs/Imu). 
    
    # Using only ground truth odometry from Gazebo (diff_drive odom disabled)
    odom0: /odom
    odom0_config: [true,  true,  false,  # x, y, z
                   false, false, true,   # roll, pitch, yaw
                   true,  true,  false,  # vx, vy, vz
                   false, false, true,   # vroll, vpitch, vyaw
                   false, false, false]  # ax, ay, az
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    
    # IMU data - NOT used in EKF fusion (disabled per user request)
    # imu0: /imu
    # imu0_config: [false, false, false,  # x, y, z (position - not provided by IMU)
    #               true,  true,  true,   # roll, pitch, yaw (orientation)
    #               false, false, false,  # vx, vy, vz (linear velocity - not provided by IMU)
    #               true,  true,  true,   # vroll, vpitch, vyaw (angular velocity)
    #               true,  true,  true]   # ax, ay, az (linear acceleration)
    # imu0_queue_size: 10
    # imu0_differential: false
    # imu0_relative: false
    # imu0_remove_gravitational_acceleration: true
    
    use_control: false
    
    # Output frames
    odom_frame: odom
    base_link_frame: base_link
